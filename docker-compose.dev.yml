# Development override: publishes backend and PostgreSQL on loopback for `npm run dev`
# and local tools, and enables /api/docs.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5444}:5432"
  migrate:
    environment:
      APP_ENV: development
  backend:
    environment:
      APP_ENV: development
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8010}:8000"
