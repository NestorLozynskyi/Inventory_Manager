[project]
name = "inventory-manager-backend"
version = "0.1.0"
description = "Inventory Manager REST API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "psycopg[binary]>=3.3,<3.4",
    "argon2-cffi>=25.1,<26",
    # full IANA database incl. legacy aliases (e.g. Chrome reports "Europe/Kiev"); the slim image lacks them
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require a real PostgreSQL (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI dependency/Query defaults are idiomatic


[tool.ruff.lint.per-file-ignores]
"app/services/demo_seed.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
